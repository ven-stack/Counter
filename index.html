<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Counter" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>COUNT UNIT — MODEL 7</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .title {
      letter-spacing: 0.35em;
      font-size: 11px;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 40px;
      font-weight: bold;
    }

    .chassis {
      background: #111;
      border: 2px solid #2a2a2a;
      padding: 36px 44px;
      position: relative;
      box-shadow: 0 0 0 1px #1a1a1a, 8px 8px 0 #050505;
      min-width: 320px;
    }

    .screw {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 1px solid #333;
      background: #1a1a1a;
    }
    .screw.tl { top: 10px; left: 10px; }
    .screw.tr { top: 10px; right: 10px; }
    .screw.bl { bottom: 10px; left: 10px; }
    .screw.br { bottom: 10px; right: 10px; }

    .display {
      background: #000;
      border: 1px solid #1e1e1e;
      padding: 20px 20px 14px;
      margin-bottom: 28px;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 0 1px #0a0a0a;
      transition: box-shadow 0.1s;
    }

    .display.flash-up   { box-shadow: inset 0 0 30px rgba(0,0,0,.8), 0 0 20px #00ff8844, 0 0 0 1px #00ff8833; }
    .display.flash-down { box-shadow: inset 0 0 30px rgba(0,0,0,.8), 0 0 20px #ff335544, 0 0 0 1px #ff335533; }
    .display.flash-rst  { box-shadow: inset 0 0 30px rgba(0,0,0,.8), 0 0 20px #ffcc0044, 0 0 0 1px #ffcc0033; }

    .scanlines {
      position: absolute; inset: 0; pointer-events: none;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    }

    .digit-row {
      display: flex;
      align-items: flex-start;
      gap: 2px;
    }

    .sign {
      font-size: 26px;
      color: #222;
      line-height: 68px;
      width: 22px;
      text-align: center;
      font-weight: bold;
      transition: color 0.15s;
    }
    .sign.negative { color: #ff3355; }

    .digit {
      font-size: 68px;
      line-height: 68px;
      font-weight: bold;
      color: #e8e8e8;
      letter-spacing: -2px;
      min-width: 48px;
      text-align: center;
      transition: color 0.12s, text-shadow 0.12s;
    }
    .flash-up   .digit { color: #00ff88; text-shadow: 0 0 24px #00ff88; }
    .flash-down .digit { color: #ff3355; text-shadow: 0 0 24px #ff3355; }
    .flash-rst  .digit { color: #ffcc00; text-shadow: 0 0 24px #ffcc00; }

    .display-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #2a2a2a;
      text-align: right;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      border: 2px solid;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: all 0.08s;
    }

    .btn-dec {
      width: 80px; height: 80px;
      background: #110008;
      border-color: #2a0010;
      color: #ff3355;
      font-size: 34px;
      box-shadow: inset 0 2px 0 #ffffff08;
    }
    .btn-dec:active, .btn-dec.held {
      background: #1a0008;
      border-color: #ff3355;
      box-shadow: 0 0 16px #ff335544, inset 0 2px 0 #ff335522;
    }

    .btn-rst {
      width: 56px; height: 80px;
      background: #0d0d00;
      border-color: #2a2800;
      color: #554400;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .btn-rst:active {
      border-color: #ffcc00;
      color: #ffcc00;
      background: #111100;
    }

    .btn-inc {
      width: 80px; height: 80px;
      background: #001108;
      border-color: #002a14;
      color: #00ff88;
      font-size: 34px;
      box-shadow: inset 0 2px 0 #ffffff08;
    }
    .btn-inc:active, .btn-inc.held {
      background: #001a0d;
      border-color: #00ff88;
      box-shadow: 0 0 16px #00ff8844, inset 0 2px 0 #00ff8822;
    }

    .bottom-strip {
      margin-top: 24px;
      border-top: 1px solid #1a1a1a;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #2a2a2a;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .btn-notify {
      background: none;
      border: 1px solid #2a2a2a;
      color: #333;
      font-size: 9px;
      letter-spacing: 0.2em;
      padding: 4px 8px;
      height: auto;
      width: auto;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .btn-notify:hover, .btn-notify.active {
      border-color: #00ff88;
      color: #00ff88;
    }
    .btn-notify.denied {
      border-color: #ff3355;
      color: #ff3355;
    }

    .footer {
      margin-top: 32px;
      font-size: 9px;
      color: #222;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="title">◼ COUNT UNIT — MODEL 7</div>

<div class="chassis">
  <div class="screw tl"></div>
  <div class="screw tr"></div>
  <div class="screw bl"></div>
  <div class="screw br"></div>

  <div class="display" id="display">
    <div class="scanlines"></div>
    <div class="digit-row">
      <div class="sign" id="sign">−</div>
      <div class="digit" id="d3">0</div>
      <div class="digit" id="d2">0</div>
      <div class="digit" id="d1">0</div>
      <div class="digit" id="d0">0</div>
    </div>
    <div class="display-label">COUNTER // ACTIVE</div>
  </div>

  <div class="controls">
    <button class="btn-dec" id="btnDec" aria-label="Decrease">−</button>
    <button class="btn-rst" id="btnRst" aria-label="Reset">RST</button>
    <button class="btn-inc" id="btnInc" aria-label="Increase">+</button>
  </div>

  <div class="bottom-strip">
    <span>HOLD TO RAPID</span>
    <button class="btn-notify" id="btnNotify">NOTIFY</button>
    <span id="serial">SN-04891</span>
  </div>
</div>

<div class="footer">◼ INDUSTRIAL SERIES ◼</div>

<script>
  // ── IndexedDB ────────────────────────────────────────────────
  const DB_NAME = 'counterDB', DB_STORE = 'state', DB_KEY = 'count';

  function openDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
      req.onsuccess = e => res(e.target.result);
      req.onerror   = e => rej(e.target.error);
    });
  }

  async function dbGet() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(DB_KEY);
      req.onsuccess = () => res(req.result ?? 0);
      req.onerror   = e => rej(e.target.error);
    });
  }

  async function dbSet(val) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(val, DB_KEY);
      tx.oncomplete = () => res(val);
      tx.onerror    = e => rej(e.target.error);
    });
  }

  // ── UI refs ──────────────────────────────────────────────────
  const display    = document.getElementById('display');
  const signEl     = document.getElementById('sign');
  const digits     = ['d0','d1','d2','d3'].map(id => document.getElementById(id));
  const serialEl   = document.getElementById('serial');
  const btnDec     = document.getElementById('btnDec');
  const btnInc     = document.getElementById('btnInc');
  const btnRst     = document.getElementById('btnRst');
  const btnNotify  = document.getElementById('btnNotify');

  let count = 0;
  let holdInterval = null, holdTimeout = null;

  // ── Render ───────────────────────────────────────────────────
  function render(c) {
    count = c;
    const abs = Math.abs(c);
    const str = String(abs).padStart(4, '0').slice(-4);
    digits.forEach((el, i) => el.textContent = str[3 - i]);
    signEl.className = 'sign' + (c < 0 ? ' negative' : '');
    serialEl.textContent = 'SN-' + String((abs * 13 + 4891) % 100000).padStart(5, '0');
  }

  function flashDisplay(type) {
    display.className = 'display flash-' + type;
    setTimeout(() => display.className = 'display', 180);
  }

  // ── Count mutations ──────────────────────────────────────────
  async function applyDelta(delta) {
    const next = count + delta;
    await dbSet(next);
    render(next);
    flashDisplay(delta > 0 ? 'up' : 'down');
    syncNotification(next);
  }

  async function applyReset() {
    await dbSet(0);
    render(0);
    flashDisplay('rst');
    syncNotification(0);
  }

  // ── Notification ─────────────────────────────────────────────
  let notifyActive = false;

  async function syncNotification(c) {
    if (!notifyActive) return;
    if (Notification.permission !== 'granted') return;
    const sw = await navigator.serviceWorker.ready;
    sw.active.postMessage({ type: 'UPDATE_NOTIF', count: c });
  }

  async function toggleNotification() {
    if (notifyActive) {
      // Turn off
      notifyActive = false;
      btnNotify.classList.remove('active');
      const sw = await navigator.serviceWorker.ready;
      sw.active.postMessage({ type: 'CLOSE_NOTIF' });
      return;
    }

    if (Notification.permission === 'denied') {
      btnNotify.classList.add('denied');
      btnNotify.textContent = 'BLOCKED';
      return;
    }

    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      btnNotify.classList.add('denied');
      btnNotify.textContent = 'BLOCKED';
      return;
    }

    notifyActive = true;
    btnNotify.classList.add('active');
    syncNotification(count);
  }

  btnNotify.addEventListener('click', toggleNotification);

  // ── Hold-to-rapid ────────────────────────────────────────────
  function startHold(fn, btnEl) {
    btnEl.classList.add('held');
    holdTimeout = setTimeout(() => {
      holdInterval = setInterval(fn, 80);
    }, 500);
  }

  function endHold(btnEl) {
    btnEl && btnEl.classList.remove('held');
    clearTimeout(holdTimeout);
    clearInterval(holdInterval);
    holdTimeout = null; holdInterval = null;
  }

  // ── Button binding ───────────────────────────────────────────
  let usingTouch = false;

  function bindBtn(btn, fn) {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault(); usingTouch = true;
      fn(); startHold(fn, btn);
    }, { passive: false });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault(); endHold(btn);
    }, { passive: false });
    btn.addEventListener('mousedown', () => {
      if (usingTouch) return;
      fn(); startHold(fn, btn);
    });
    btn.addEventListener('mouseup',    () => endHold(btn));
    btn.addEventListener('mouseleave', () => endHold(btn));
  }

  bindBtn(btnInc, () => applyDelta(+1));
  bindBtn(btnDec, () => applyDelta(-1));

  btnRst.addEventListener('touchstart', (e) => { e.preventDefault(); applyReset(); }, { passive: false });
  btnRst.addEventListener('mousedown',  ()  => { if (!usingTouch) applyReset(); });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp'   || e.key === '+') applyDelta(+1);
    if (e.key === 'ArrowDown' || e.key === '-') applyDelta(-1);
    if (e.key === 'r' || e.key === 'R' || e.key === 'Escape') applyReset();
  });

  // ── SW messages (count updated from notification action) ──────
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data?.type === 'COUNT_UPDATED') {
      render(e.data.count);
      flashDisplay(e.data.count > count ? 'up' : e.data.count < count ? 'down' : 'rst');
    }
  });

  // ── Init ─────────────────────────────────────────────────────
  async function init() {
    const saved = await dbGet();
    render(saved);

    if ('serviceWorker' in navigator) {
      await navigator.serviceWorker.register('sw.js');
    }

    // Restore notify button state if permission already granted
    if (Notification.permission === 'granted') {
      // Don't auto-show notification on load — user must tap NOTIFY
    } else if (Notification.permission === 'denied') {
      btnNotify.classList.add('denied');
      btnNotify.textContent = 'BLOCKED';
    }
  }

  init();
</script>
</body>
</html>
